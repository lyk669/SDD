[project]
name = "daily-report"
version = "0.1.0"
description = "智能日报生成器 — 从 GitHub/飞书采集数据并生成推送日报"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "pyyaml>=6.0",
    "jinja2>=3.1.0",
    "python-dotenv>=1.0.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-mock>=3.12.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["collector", "generator", "notifier", "shared"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

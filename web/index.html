<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
  <meta name="color-scheme" content="light dark"/>
  <title>智能日报生成器 · 工作台</title>
  <meta name="description" content="团队日报自动化工作台：采集当日工作数据 → 按成员生成日报 → 邮件推送 → 查看历史。"/>

  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"/>
  <link rel="stylesheet" href="/web/styles.css"/>
</head>
<body>
  <a class="skip-link" href="#main">跳到主要内容</a>

  <div class="app-shell">
    <!-- 侧栏 -->
    <aside class="sidebar" aria-label="主导航">
      <div class="brand">
        <span class="brand__mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor"
               stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 19V5"/><path d="M9 19v-7"/><path d="M14 19v-4"/><path d="M19 19V8"/>
          </svg>
        </span>
        <span class="brand__text">
          <span class="brand__name">智能日报生成器</span>
          <span class="brand__sub">采集 · 生成 · 推送</span>
        </span>
      </div>

      <nav class="nav" aria-label="模块">
        <div class="nav__label">管道工作台</div>
        <a class="nav__item" href="#/reports" data-route="reports">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="M9 13h6"/><path d="M9 17h4"/>
          </svg>
          <span>日报历史</span>
        </a>
        <a class="nav__item" href="#/emails" data-route="emails">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/>
          </svg>
          <span>发送记录</span>
        </a>
        <a class="nav__item" href="#/members" data-route="members">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>
          </svg>
          <span>成员映射</span>
        </a>
        <a class="nav__item" href="#/settings" data-route="settings">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M4 6h16"/><path d="M4 12h16"/><path d="M4 18h16"/><circle cx="9" cy="6" r="2"/><circle cx="15" cy="12" r="2"/><circle cx="8" cy="18" r="2"/>
          </svg>
          <span>采集与推送</span>
        </a>
        <a class="nav__item" href="#/runs" data-route="runs">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M3 12h4l2 6 4-14 2 8h6"/>
          </svg>
          <span>管道运行</span>
        </a>
      </nav>

      <div class="sidebar__foot">
        <div class="row"><span>存储</span><span class="mono" id="sideDb">data/daily_reports.db</span></div>
        <div class="row"><span>模式</span><span class="mono">CLI / API</span></div>
        <div class="row"><span>状态</span><span class="dot-live" id="sideStatus">检测中…</span></div>
      </div>
    </aside>

    <!-- 工作区 -->
    <div class="workspace">
      <header class="topbar">
        <div class="topbar__title">
          <h1 id="topbarTitle">日报</h1>
          <span class="topbar__crumb" id="topbarCrumb"></span>
        </div>
        <div class="topbar__actions" id="topbarActions"></div>
      </header>

      <main class="content" id="main" tabindex="-1"></main>
    </div>
  </div>

  <div class="toast-region" id="toastRegion" role="status" aria-live="polite"></div>
  <div class="modal-root" id="modalRoot"></div>

  <script src="/web/api.js"></script>
  <script src="/web/app.js"></script>
</body>
</html>

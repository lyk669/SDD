name: Run Tests

# 触发条件：当你 push 代码或发起 PR 时自动运行
on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: 检出代码
      uses: actions/checkout@v4

    - name: 设置 Python 环境
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip' # 缓存依赖加速后续运行

    - name: 安装依赖
      run: |
        python -m pip install --upgrade pip
        pip install pytest httpx pyyaml python-dotenv
        # 如果你的项目需要其他依赖，请在这里加上，比如：pip install -e .

    - name: 运行测试
      run: |
        pytest tests/test_generator.py -v